app = "anca-frontend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "https://anca-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
